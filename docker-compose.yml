# Whole stack: Postgres + Spring Boot API (:8080) + Next.js app (:3000).
# For a zero-dependency look around, skip this and run the backend's `dev` profile (in-memory H2, seeded demo league).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sidequest
      POSTGRES_USER: sidequest
      POSTGRES_PASSWORD: sidequest
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sidequest"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sidequest
      SPRING_DATASOURCE_USERNAME: sidequest
      SPRING_DATASOURCE_PASSWORD: sidequest
      SIDEQUEST_SEED_ENABLED: "true"          # demo league; turn off for real data
      SIDEQUEST_JWT_SECRET: ${SIDEQUEST_JWT_SECRET:?set SIDEQUEST_JWT_SECRET (32+ random chars)}
      SIDEQUEST_CORS_ORIGINS: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports: ["8080:8080"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/v1
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
