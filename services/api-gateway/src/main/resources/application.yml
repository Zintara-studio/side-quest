spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth
          uri: ${AUTH_URI:http://localhost:8081}
          predicates: [Path=/api/v1/auth/**]
        - id: users
          uri: ${USER_URI:http://localhost:8082}
          predicates: [Path=/api/v1/users/**]
        - id: players
          uri: ${PLAYER_URI:http://localhost:8083}
          predicates: [Path=/api/v1/players/**, Path=/api/v1/free-agents/**]
        - id: franchises
          uri: ${FRANCHISE_URI:http://localhost:8084}
          predicates: [Path=/api/v1/franchises/**]
        - id: tournaments
          uri: ${TOURNAMENT_URI:http://localhost:8085}
          predicates: [Path=/api/v1/tournaments/**]
        - id: matches
          uri: ${MATCH_URI:http://localhost:8086}
          predicates: [Path=/api/v1/matches/**]
        - id: matches-ws
          uri: ${MATCH_WS_URI:ws://localhost:8086}
          predicates: [Path=/ws/match/**]
        - id: auctions
          uri: ${AUCTION_URI:http://localhost:8087}
          predicates: [Path=/api/v1/auctions/**]
        - id: auctions-ws
          uri: ${AUCTION_WS_URI:ws://localhost:8087}
          predicates: [Path=/ws/auction/**]
        - id: rankings
          uri: ${RANKING_URI:http://localhost:8088}
          predicates: [Path=/api/v1/rankings/**]
        - id: analytics
          uri: ${ANALYTICS_URI:http://localhost:8089}
          predicates: [Path=/api/v1/analytics/**, Path=/graphql]
        - id: notifications
          uri: ${NOTIFICATION_URI:http://localhost:8090}
          predicates: [Path=/api/v1/notifications/**]
        - id: community
          uri: ${COMMUNITY_URI:http://localhost:8091}
          predicates: [Path=/api/v1/community/**]
        - id: media
          uri: ${MEDIA_URI:http://localhost:8092}
          predicates: [Path=/api/v1/media/**]
        - id: payments
          uri: ${PAYMENT_URI:http://localhost:8093}
          predicates: [Path=/api/v1/payments/**]
        - id: ai
          uri: ${AI_URI:http://localhost:8094}
          predicates: [Path=/api/v1/ai/**]

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web.exposure.include: health,info,prometheus,gateway
