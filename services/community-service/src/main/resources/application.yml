spring:
  application:
    name: community-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/community}
    username: ${DB_USER:community}
    password: ${DB_PASSWORD:community}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  graphql:
    graphiql:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: community-service
      enable-auto-commit: false
      auto-offset-reset: earliest

server:
  port: 8091
  shutdown: graceful

management:
  endpoints:
    web.exposure.include: health,info,prometheus
