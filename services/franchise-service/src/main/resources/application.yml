spring:
  application:
    name: franchise-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/franchises}
    username: ${DB_USER:franchises}
    password: ${DB_PASSWORD:franchises}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: franchise-service
      enable-auto-commit: false
      auto-offset-reset: earliest

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web.exposure.include: health,info,prometheus
