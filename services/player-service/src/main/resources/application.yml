spring:
  application:
    name: player-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/players}
    username: ${DB_USER:players}
    password: ${DB_PASSWORD:players}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: player-service
      enable-auto-commit: false
      auto-offset-reset: earliest

server:
  port: 8083
  shutdown: graceful

management:
  endpoints:
    web.exposure.include: health,info,prometheus
