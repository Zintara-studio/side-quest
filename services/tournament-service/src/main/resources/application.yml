spring:
  application:
    name: tournament-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tournaments}
    username: ${DB_USER:tournaments}
    password: ${DB_PASSWORD:tournaments}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: tournament-service
      enable-auto-commit: false
      auto-offset-reset: earliest

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web.exposure.include: health,info,prometheus
