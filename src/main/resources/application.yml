server:
  port: 8080
  servlet:
    context-path: /v1
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/css,application/javascript
    min-response-size: 1024

spring:
  application:
    name: sidequest-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# JWT + app config (overridable via env)
sidequest:
  jwt:
    secret: ${SIDEQUEST_JWT_SECRET:change-me-in-prod-this-is-a-very-long-dev-only-secret-key-0123456789}
    access-token-ttl-seconds: 900        # 15 minutes (per architecture doc)
    refresh-token-ttl-seconds: 1209600   # 14 days
    issuer: sidequest.gg
  cors:
    allowed-origins: ${SIDEQUEST_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  uploads:
    base-url: ${SIDEQUEST_UPLOADS_BASE_URL:https://cdn.sidequest.gg}

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
  api-docs:
    path: /api-docs

---
# Default dev profile: in-memory H2, schema auto-created, demo data seeded.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:sidequest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

sidequest:
  seed:
    enabled: true

---
# Production-ish profile: PostgreSQL, validate schema, no seeding.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sidequest}
    username: ${SPRING_DATASOURCE_USERNAME:sidequest}
    password: ${SPRING_DATASOURCE_PASSWORD:sidequest}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

sidequest:
  seed:
    enabled: ${SIDEQUEST_SEED_ENABLED:false}
  jwt:
    # Required in production — no fallback, so the app fails fast at startup if the env var is unset
    # rather than silently signing tokens with the committed dev-only secret.
    secret: ${SIDEQUEST_JWT_SECRET}

# The full API surface (including admin routes) should not be publicly browsable in production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
